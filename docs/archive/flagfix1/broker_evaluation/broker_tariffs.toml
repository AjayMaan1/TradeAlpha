# Broker tariffs and data capabilities, as consumed by broker_compare.py. EDIT THIS FILE after you verify each value.
#
# Confidence codes (field "conf" maps field name -> code):
#   V = capability VERIFIED in the broker's official Python SDK source (downloaded from PyPI in this evaluation);
#       verifies that the API exists, not its price or its depth
#   H / M / L = assistant knowledge (high / medium / low confidence). Knowledge cut-off is older than the current date,
#       and broker websites were NOT reachable from the evaluation sandbox. Treat every H/M/L value as
#       "to be verified" on the broker's pricing / API documentation page.
#   ? = unknown. The calculator treats it as missing and flags it.
#
# Money in INR, EXCLUDING GST (GST 18 % is added by the calculator). Percentages as fractions (0.0003 = 0.03 %).
# brokerage leg: {pct = x, cap = y} means min(x * value, y); {flat = y} means y per executed order; {pct = x} is
# uncapped; {pct = 0} is free. "min" = minimum per order.
#
# Data: max_days = max calendar days per history request by interval (as implemented by the broker, not OpenAlgo);
# rate = history-endpoint limits; depth_1m_years = how far back 1-minute history goes.

meta.as_of = "assistant knowledge + SDK inspection; sandbox could not reach broker sites - VERIFY"
meta.sdk_versions = "kiteconnect 5.2.2, smartapi-python 1.5.5, upstox-python-sdk 2.30.0, fyers-apiv3 3.2.0, dhanhq 2.3.0, breeze-connect 1.0.69, growwapi 1.5.0, py5paisa 0.7.21.2, NorenRestApiPy 0.0.22, pya3 1.0.30, openalgo 2.0.5"

